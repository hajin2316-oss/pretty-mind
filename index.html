<script>
function setLanguage(lang) {
  const translations = {
    en: {
      tagline: "Dress your vibe, Doll up your mind. ♡",
      startButton: "Start MY Vibe ♡",
      contactLink: "Contact ♡",
      copyrightNotice: "All rights reserved. Unauthorized copying, reproduction, or distribution of Pretty Mind content is strictly prohibited and may result in legal action."
    },

    ko: {
      tagline: "오늘의 무드를 입고, 마음까지 예쁘게. ♡",
      startButton: "나의 Vibe 찾기 ♡",
      contactLink: "문의하기 ♡",
      copyrightNotice: "모든 권리는 Pretty Mind에 있습니다. Pretty Mind 콘텐츠의 무단 복제, 재생산 또는 배포는 엄격히 금지되며 법적 조치로 이어질 수 있습니다."
    },

    ja: {
      tagline: "今日のムードをまとって、心まで可愛く。♡",
      startButton: "私のVibeを見つける ♡",
      contactLink: "お問い合わせ ♡",
      copyrightNotice: "すべての権利はPretty Mindに帰属します。Pretty Mindのコンテンツの無断複製、転載、配布は固く禁止されており、法的措置の対象となる場合があります。"
    }
  };

  document.getElementById("tagline").textContent =
    translations[lang].tagline;

  document.getElementById("startButton").textContent =
    translations[lang].startButton;

  document.getElementById("contactLink").textContent =
    translations[lang].contactLink;

  document.getElementById("copyrightNotice").textContent =
    translations[lang].copyrightNotice;

  localStorage.setItem("prettyMindLanguage", lang);
}

const savedLanguage =
  localStorage.getItem("prettyMindLanguage") || "en";

setLanguage(savedLanguage);


/* =========================================
   Pretty Mind - Basic Content Protection
   ========================================= */

function isEditableElement(element) {
  return (
    element &&
    (
      element.tagName === "INPUT" ||
      element.tagName === "TEXTAREA" ||
      element.tagName === "SELECT" ||
      element.isContentEditable
    )
  );
}

/* Disable right-click except inside editable fields */
document.addEventListener("contextmenu", function(event) {
  if (!isEditableElement(event.target)) {
    event.preventDefault();
  }
});

/* Prevent image dragging */
document.addEventListener("dragstart", function(event) {
  if (event.target.tagName === "IMG") {
    event.preventDefault();
  }
});

/* Prevent ordinary copying outside editable fields */
document.addEventListener("copy", function(event) {
  if (!isEditableElement(event.target)) {
    event.preventDefault();
  }
});

/* Prevent cut outside editable fields */
document.addEventListener("cut", function(event) {
  if (!isEditableElement(event.target)) {
    event.preventDefault();
  }
});

/* Block simple Save Page shortcut */
document.addEventListener("keydown", function(event) {
  const key = event.key.toLowerCase();

  if ((event.ctrlKey || event.metaKey) && key === "s") {
    event.preventDefault();
  }
});
</script>

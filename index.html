<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretty Mind ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap');
body {
background:
radial-gradient(circle at 20% 20%, rgba(255,255,255,.75), transparent 35%),
linear-gradient(135deg,#fce4ec 0%,#f8cddd 50%,#fce7ef 100%);
text-align:center;
padding-top:80px;
margin:0;
min-height:100vh;
}
button {
background-color:#e75480;
color:white;
font-size:18px;
padding:12px 30px;
border:none;
border-radius:25px;
cursor:pointer;
transition:.3s;
box-shadow:0 4px 10px rgba(231,84,128,.25);
}
button:hover { background-color:#d94f78; transform:translateY(-3px); }

.language-switcher {
position:fixed;
top:20px;
right:25px;
z-index:1000;
display:flex;
align-items:center;
gap:7px;
font-family:Georgia,"Times New Roman",serif;
color:#b85c7a;
background:rgba(255,255,255,.45);
padding:7px 12px;
border-radius:999px;
border:1px solid rgba(184,92,122,.25);
backdrop-filter:blur(8px);
}
.language-switcher button {
background:transparent;
color:#b85c7a;
border:none;
padding:2px 4px;
font-family:inherit;
font-size:13px;
box-shadow:none;
cursor:pointer;
}
.language-switcher button:hover { background:transparent; color:#d94f78; transform:none; }

p {
color:#b85c7a;
font-size:20px;
margin-top:10px;
margin-bottom:20px;
}
.hero {
position:relative;
background-color:rgba(255,255,255,.45);
width:600px;
max-width:80%;
margin:0 auto;
box-sizing:border-box;
padding:50px 30px;
border-radius:35px;
box-shadow:0 8px 30px rgba(231,84,128,.18);
border:1px solid rgba(255,255,255,.7);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}
h1 {
color:#d94f87;
font-size:60px;
font-family:"Dancing Script",cursive;
font-weight:normal;
letter-spacing:3px;
text-shadow:0 2px 8px rgba(231,84,128,.18);
}
.hero-actions {
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:12px;
}
.study-button {
background:rgba(255,255,255,.78);
color:#d94f78;
border:1px solid rgba(231,84,128,.28);
box-shadow:0 4px 10px rgba(231,84,128,.12);
}
.study-button:hover {
background:#fff4f8;
color:#c9436d;
}
.sparkle {
position:absolute;
color:#e75480;
opacity:.65;
pointer-events:none;
animation:twinkle 2.4s ease-in-out infinite;
}
.sparkle1 { top:25px; left:40px; font-size:24px; }
.sparkle2 { top:35px; right:45px; font-size:22px; animation-delay:.5s; }
.sparkle3 { bottom:35px; left:55px; font-size:18px; animation-delay:1s; }
.sparkle4 { bottom:25px; right:55px; font-size:25px; animation-delay:1.5s; }
@keyframes twinkle {
0%,100% { opacity:.35; transform:scale(.85); }
50% { opacity:1; transform:scale(1.15); }
}
.site-footer {
margin-top:40px;
padding:20px 15px 30px;
text-align:center;
font-size:14px;
color:#b85c7a;
opacity:.8;
}
.site-footer a { color:#b85c7a; text-decoration:none; }
.site-footer a:hover { text-decoration:underline; }
.copyright-notice { margin-top:8px; font-size:11px; opacity:.6; line-height:1.5; }

@media (max-width:560px) {
body { padding-top:72px; }
.language-switcher { top:16px; right:16px; }
.hero { max-width:90%; padding:42px 22px; }
h1 { font-size:48px; }
p { font-size:18px; }
.hero-actions { flex-direction:column; }
.hero-actions button { width:min(280px,100%); }
}
</style>
</head>
<body>

<div class="language-switcher">
  <button onclick="setLanguage('en')">EN</button>
  <span>·</span>
  <button onclick="setLanguage('ko')">한국어</button>
  <span>·</span>
  <button onclick="setLanguage('ja')">日本語</button>
</div>

<div class="hero">
  <h1>Pretty Mind ♡</h1>
  <p id="tagline">Dress your vibe, Doll up your mind. ♡</p>

  <div class="hero-actions">
    <button id="startButton" onclick="location.href='vibes.html'">Start MY Vibe ♡</button>
    <button id="studyTimerButton" class="study-button" onclick="location.href='study-timer.html'">Study Timer ⏱️</button>
  </div>

  <span class="sparkle sparkle1">✦</span>
  <span class="sparkle sparkle2">♡</span>
  <span class="sparkle sparkle3">✦</span>
  <span class="sparkle sparkle4">⋆</span>
</div>

<footer class="site-footer">
  <a id="contactLink" href="contact.html">Contact ♡</a>
  <span> · </span>
  <span>© 2026 Pretty Mind</span>
  <div id="copyrightNotice" class="copyright-notice">
    All rights reserved. Unauthorized copying, reproduction, or distribution of Pretty Mind content is strictly prohibited and may result in legal action.
  </div>
</footer>

<script>
function setLanguage(lang) {
  const translations = {
    en: {
      tagline: "Dress your vibe, Doll up your mind. ♡",
      startButton: "Start MY Vibe ♡",
      studyTimerButton: "Study Timer ⏱️",
      contactLink: "Contact ♡",
      copyrightNotice: "All rights reserved. Unauthorized copying, reproduction, or distribution of Pretty Mind content is strictly prohibited and may result in legal action."
    },
    ko: {
      tagline: "오늘의 무드를 입고, 마음까지 예쁘게. ♡",
      startButton: "나의 Vibe 찾기 ♡",
      studyTimerButton: "스터디 타이머 ⏱️",
      contactLink: "문의하기 ♡",
      copyrightNotice: "모든 권리는 Pretty Mind에 있습니다. Pretty Mind 콘텐츠의 무단 복제, 재생산 또는 배포는 엄격히 금지되며 법적 조치로 이어질 수 있습니다."
    },
    ja: {
      tagline: "今日のムードをまとって、心まで可愛く。♡",
      startButton: "私のVibeを見つける ♡",
      studyTimerButton: "スタディタイマー ⏱️",
      contactLink: "お問い合わせ ♡",
      copyrightNotice: "すべての権利はPretty Mindに帰属します。Pretty Mindのコンテンツの無断複製、転載、配布は固く禁止されており、法的措置の対象となる場合があります。"
    }
  };

  document.getElementById("tagline").textContent = translations[lang].tagline;
  document.getElementById("startButton").textContent = translations[lang].startButton;
  document.getElementById("studyTimerButton").textContent = translations[lang].studyTimerButton;
  document.getElementById("contactLink").textContent = translations[lang].contactLink;
  document.getElementById("copyrightNotice").textContent = translations[lang].copyrightNotice;

  localStorage.setItem("prettyMindLanguage", lang);
}

const savedLanguage = localStorage.getItem("prettyMindLanguage") || "en";
setLanguage(savedLanguage);
</script>

</body>
</html>

    }

      color: #b85c7a;

      text-decoration: none;

      font-size: 15px;
    }

    .back-link:hover {
      color: #e75480;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      margin: 0;

      font-size: 48px;

      color: #e75480;
    }

    .header p {
      margin: 12px 0 0;

      font-size: 18px;

      color: #b85c7a;
    }

    .search-wrap {
      display: flex;
      justify-content: center;

      margin: 30px 0 40px;
    }

    #searchInput {
      width: min(520px, 100%);

      padding: 14px 20px;

      border:
        1px solid rgba(231, 84, 128, 0.25);

      border-radius: 30px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.7);

      color: #b85c7a;

      font-size: 16px;

      box-shadow:
        0 6px 18px rgba(231, 84, 128, 0.12);
    }

    #searchInput:focus {
      border-color: #e75480;
    }

    .aesthetic-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 22px;
    }

    .aesthetic-card {
      background:
        rgba(255, 255, 255, 0.68);

      border:
        1px solid rgba(255, 255, 255, 0.9);

      border-radius: 28px;

      padding: 28px 22px;

      text-align: center;

      box-shadow:
        0 8px 28px rgba(231, 84, 128, 0.14);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .aesthetic-card:hover {
      transform: translateY(-7px);

      box-shadow:
        0 15px 35px rgba(231, 84, 128, 0.22);
    }

    .emoji {
      font-size: 35px;

      margin-bottom: 12px;
    }

    .aesthetic-card h2 {
      margin: 0 0 12px;

      font-size: 23px;

      color: #d94f87;
    }

    .keywords {
      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 7px;
    }

    .keyword {
      padding: 6px 10px;

      border-radius: 999px;

      background:
        rgba(255, 224, 235, 0.8);

      border:
        1px solid rgba(231, 84, 128, 0.18);

      color: #b85c7a;

      font-size: 12px;
    }

    .empty-message {
      display: none;

      text-align: center;

      margin-top: 40px;

      color: #b85c7a;

      font-size: 18px;
    }

    .footer-note {
      text-align: center;

      margin-top: 55px;

      color: #b85c7a;

      font-size: 14px;
    }
.language-switcher {
  display: flex;

    ko: ["미래적인", "디지털", "메탈릭", "테크"],
    ja: ["近未来的", "デジタル", "メタリック", "テック"]
  }
},

{
  id: "Vintage",
  emoji: "📻",
  names: {
    en: "Vintage",
    ko: "빈티지",
    ja: "ヴィンテージ"
  },
  keywords: {
    en: ["nostalgic", "timeless", "retro", "classic"],
    ko: ["향수를 불러일으키는", "유행을 타지 않는", "레트로", "클래식"],
    ja: ["ノスタルジック", "タイムレス", "レトロ", "クラシック"]
  }
}

    ];


    const grid =
      document.getElementById("aestheticGrid");

    const searchInput =
      document.getElementById("searchInput");

    const emptyMessage =
      document.getElementById("emptyMessage");


  function showAesthetics(list) {

  const lang =
    localStorage.getItem("prettyMindLanguage") || "en";

  grid.innerHTML =
    list.map(aesthetic => {

      const displayName =
        aesthetic.names
          ? aesthetic.names[lang]
          : aesthetic.name;

      const displayKeywords =
        aesthetic.keywords[lang]
          ? aesthetic.keywords[lang]
          : aesthetic.keywords;

      const detailName =
        aesthetic.id || aesthetic.name;

      const tags =
        displayKeywords
          .map(keyword =>
            `<span class="keyword">${keyword}</span>`
          )
          .join("");

      return `
<article
    class="aesthetic-card"
    onclick="window.location.href='aesthetic-detail.html?name=' + encodeURIComponent('${detailName}')"
>

    <div class="emoji">
        ${aesthetic.emoji}
    </div>

    <h2>
        ${displayName}
    </h2>

    <div class="keywords">
        ${tags}
    </div>

</article>
      `;

    }).join("");

  emptyMessage.style.display =
    list.length === 0
      ? "block"
      : "none";
}
setLanguage(savedLanguage);
    showAesthetics(aesthetics);


   searchInput.addEventListener(
  "input",
  function () {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();

    const filtered =
      aesthetics.filter(aesthetic => {

        const allNames =
          Object.values(aesthetic.names)
            .join(" ");

        const allKeywords =
          Object.values(aesthetic.keywords)
            .flat()
            .join(" ");

        const text =
          (
            aesthetic.id
            + " "
            + allNames
            + " "
            + allKeywords
          ).toLowerCase();

        return text.includes(search);

      });

    showAesthetics(filtered);

  }
);

  </script>

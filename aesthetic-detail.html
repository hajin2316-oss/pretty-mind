<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pretty Mind | Aesthetic Detail</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.8), transparent 35%),
        linear-gradient(135deg, #fce4ec 0%, #f8cddd 50%, #fce7ef 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: #b85c7a;
    }

    .page {
      width: min(1050px, 92%);
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #b85c7a;
      text-decoration: none;
    }

    .back-link:hover {
      color: #e75480;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .emoji {
      font-size: 52px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 50px;
      color: #e75480;
    }

    .keyword-line {
      margin-top: 12px;
      color: #b85c7a;
      font-size: 17px;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: start;
    }

    .visual-card,
    .info-card {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(231,84,128,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .visual-card {
      padding: 16px;
      text-align: center;
    }

    .visual-card img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 22px;
      display: none;
    }

    .placeholder {
      min-height: 390px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.85),
          rgba(255,224,235,0.75)
        );
      font-size: 70px;
    }

    .info-card {
      padding: 30px;
    }

    .section {
      padding: 20px 0;
      border-bottom: 1px solid rgba(231,84,128,0.13);
    }

    .section:first-child {
      padding-top: 0;
    }

    .section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .section h2 {
      margin: 0 0 10px;
      color: #d94f87;
      font-size: 22px;
    }

    .section p {
      margin: 0;
      line-height: 1.8;
      font-size: 16px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
    }

    .tag {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,225,236,0.8);
      border: 1px solid rgba(231,84,128,0.2);
      color: #c9587f;
      font-size: 13px;
    }

    .not-found {
      display: none;
      text-align: center;
      padding: 80px 20px;
      font-size: 22px;
    }

    .style-guide {
      margin-top: 55px;
    }

    .guide-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .guide-title h2 {
      margin: 0;
      font-size: 34px;
      color: #e75480;
    }

    .guide-title p {
      margin-top: 10px;
      color: #b85c7a;
      font-size: 16px;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .guide-card {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(231, 84, 128, 0.14);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .guide-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 34px rgba(231, 84, 128, 0.22);
    }

    .guide-icon {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .guide-card h3 {
      margin: 0 0 12px;
      color: #d94f87;
      font-size: 22px;
    }

    .guide-card p {
      margin: 0;
      line-height: 1.7;
      color: #b85c7a;
      font-size: 15px;
    }

    .language-switcher {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      font-size: 0.9rem;
      color: #b85c7a;
    }

    .language-switcher button {
      margin: 0;
      padding: 0;
      background: none;
      border: none;
      color: #b85c7a;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }

    .language-switcher button:hover {
      color: #e75480;
    }

    @media (max-width: 760px) {
      .detail-layout {
        grid-template-columns: 1fr;
      }

      .visual-card {
        max-width: 360px;
        width: 100%;
        margin: 0 auto;
      }

      h1 {
        font-size: 38px;
      }

      .guide-grid {
        grid-template-columns: 1fr;
      }

      .style-guide {
        margin-top: 40px;
      }
    }
  </style>
</head>

<body>

    <div class="language-switcher">

          </div>

          <div class="section">

          </div>

          <div class="section">
            <h2 id="accessoriesTitle">💎 Accessories</h2>

    <div id="notFound" class="not-found">

          <h3 id="guideHairTitle">Hair & Accessories</h3>
          <p id="guideHair"></p>
        </article>
      </div>
    </section>
  </main>

const params = new URLSearchParams(window.location.search);
const aestheticName = params.get("name");

function renderAesthetic() {
  const lang = localStorage.getItem("prettyMindLanguage") || "en";
  const aesthetic = aesthetics[aestheticName];

  if (aesthetic) {
    document.getElementById("detailContent").style.display = "block";
    document.getElementById("styleGuide").style.display = "block";
    document.getElementById("notFound").style.display = "none";

    const displayName =
      aesthetic.names?.[lang] || aesthetic.names?.en || aestheticName;

    const localized = (field) =>
      aesthetic[field]?.[lang] || aesthetic[field]?.en || aesthetic[field] || "";

    const displayKeywords =
      aesthetic.keywords?.[lang] || aesthetic.keywords?.en || [];

    document.getElementById("name").textContent = displayName;
    document.getElementById("emoji").textContent = aesthetic.emoji;
    document.getElementById("colors").textContent = localized("colors");
    document.getElementById("makeup").textContent = localized("makeup");
    document.getElementById("hair").textContent = localized("hair");
    document.getElementById("outfit").textContent = localized("outfit");
    document.getElementById("accessories").textContent = localized("accessories");

    document.getElementById("guideMakeup").textContent =
      aesthetic.guideMakeup?.[lang] || localized("makeup");

    document.getElementById("guideOutfit").textContent =
      aesthetic.guideOutfit?.[lang] || localized("outfit");

    document.getElementById("guideHair").textContent =
      aesthetic.guideHair?.[lang] ||
      (localized("hair") + " · " + localized("accessories"));

    document.getElementById("keywordLine").textContent =
      displayKeywords.join(" · ");

    const tags = document.getElementById("tags");
    tags.innerHTML = displayKeywords
      .map(keyword => `<span class="tag">${keyword}</span>`)
      .join("");

    const image = document.getElementById("moodImage");
    const placeholder = document.getElementById("placeholder");

    if (aesthetic.image) {
      image.src = aesthetic.image;
      image.alt = displayName + " moodboard";
      image.style.display = "block";
      placeholder.style.display = "none";
    } else {
      image.removeAttribute("src");
      image.style.display = "none";
      placeholder.style.display = "flex";
      placeholder.textContent = aesthetic.emoji;
    }

    document.title = "Pretty Mind | " + displayName;

  } else {
    document.getElementById("detailContent").style.display = "none";
    document.getElementById("styleGuide").style.display = "none";
    document.getElementById("notFound").style.display = "block";
  }
}

    const savedLanguage = localStorage.getItem("prettyMindLanguage") || "en";
const canvas = document.getElementById("rouletteWheel");
const ctx = canvas.getContext("2d");

const wheelSize = canvas.width;
const center = wheelSize / 2;
const radius = center - 10;
const sliceAngle = (Math.PI * 2) / vibes.length;

const wheelColors = [
  "#f7c6d9",
  "#e9a8c1",
  "#f3d7e2",
  "#d98aaa",
  "#f8e4ec",
  "#c97799"
];

function drawWheel() {
  ctx.clearRect(0, 0, wheelSize, wheelSize);

  vibes.forEach((vibe, index) => {
    const startAngle = index * sliceAngle - Math.PI / 2;
    const endAngle = startAngle + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, startAngle, endAngle);
    ctx.closePath();

    ctx.fillStyle = wheelColors[index % wheelColors.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.65)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(startAngle + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#6f3f52";
    ctx.font = "bold 11px Georgia";
    const lang = localStorage.getItem("prettyMindLanguage") || "en";
    ctx.fillText(vibe.names[lang], radius - 15, 4);
    ctx.restore();
  });
}

let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  return audioCtx;
}

function playTickSound() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.type = "square";
  oscillator.frequency.value = 180;

  gain.gain.setValueAtTime(0.035, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + 0.025
  );

  oscillator.start(ctx.currentTime);
  oscillator.stop(ctx.currentTime + 0.025);
}

    oscillator.connect(gain);

    oscillator.type = "sine";

    const startTime = ctx.currentTime + index * 0.12;

    gain.gain.setValueAtTime(0.001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.08, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);

    oscillator.start(startTime);
    oscillator.stop(startTime + 0.36);
  });
}
spinButton.addEventListener("click", function () {
  if (isSpinning) return;

  isSpinning = true;
  let tickDelay = 70;
let tickElapsed = 0;

function spinTick() {
  playTickSound();

  tickElapsed += tickDelay;

  if (tickElapsed < 4400) {
    tickDelay = 70 + Math.pow(tickElapsed / 4400, 2) * 350;
    setTimeout(spinTick, tickDelay);
  }
}

spinTick();
  spinButton.disabled = true;
  exploreLink.style.display = "none";

  resultEmoji.textContent = "✨";
  const lang = localStorage.getItem("prettyMindLanguage") || "en";
  resultName.textContent = translations[lang].spinning;
  resultKeywords.textContent = translations[lang].choosing;

  const randomIndex = Math.floor(Math.random() * vibes.length);
  selectedVibe = vibes[randomIndex];

  const sliceDegrees = 360 / vibes.length;

  const targetPosition =
    (360 - ((randomIndex + 0.5) * sliceDegrees) % 360) % 360;

  const currentPosition =
    ((currentRotation % 360) + 360) % 360;

  const extraRotation =
    (targetPosition - currentPosition + 360) % 360;

  currentRotation += (360 * 5) + extraRotation;

  canvas.style.transition =
    "transform 4.5s cubic-bezier(0.12, 0.72, 0.18, 1)";

  canvas.style.transform =
    `rotate(${currentRotation}deg)`;

  setTimeout(function () {
    if ("vibrate" in navigator) {
  navigator.vibrate([80, 40, 120]);
      playResultSound();

if ("vibrate" in navigator) {
  navigator.vibrate([80, 40, 120]);
}
}
    resultEmoji.textContent = selectedVibe.emoji;
    const resultLang = localStorage.getItem("prettyMindLanguage") || "en";
    resultName.textContent = selectedVibe.names[resultLang];
    resultKeywords.textContent = selectedVibe.keywords[resultLang];

    exploreLink.href =
      "aesthetic-detail.html?name=" +
      encodeURIComponent(selectedVibe.id);

    exploreLink.style.display = "inline-block";

    spinButton.disabled = false;
    isSpinning = false;
  }, 4600);
});

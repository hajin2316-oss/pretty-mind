<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      display: flex;
      align-items: center;

    .roulette-card {

      margin-top: 0;

    .subtitle {

    }

    .result {
      min-height: 140px;
      margin: 25px 0;
      padding: 25px;
      border-radius: 22px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(184, 92, 122, 0.2);
      display: flex;
      flex-direction: column;

    .result-emoji {
      font-size: 2.5rem;

    }

    button,

      margin-top: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.25s ease;
    }

    button {
      background: #d96b92;
      color: white;
    }

    button:hover {
      transform: translateY(-2px);
      background: #c95c83;
    }

    .explore-link {
      display: none;
      background: rgba(255,255,255,0.7);
      color: #b84d75;
      border: 1px solid rgba(184, 92, 122, 0.25);
    }

    .explore-link:hover {
      transform: translateY(-2px);
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #b85c7a;
      text-decoration: none;
    }
    .wheel-wrap {
  position: relative;
  width: min(520px, 100%);
  aspect-ratio: 1 / 1;
  margin: 25px auto 35px;
}

#rouletteWheel {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  box-shadow: 0 12px 35px rgba(184, 92, 122, 0.25);
}
@media (max-width: 560px) {
  .wheel-wrap {
    width: 100%;
    max-width: 420px;
    margin: 22px auto 30px;
  }

  #rouletteWheel {
    width: 100%;
    height: auto;
  }
}
.pointer {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: 38px;
  color: #d96b92;
  text-shadow: 0 3px 8px rgba(184, 92, 122, 0.25);
}
  .language-switcher {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 9px;
  margin-bottom: 20px;
  font-size: 0.9rem;
  color: #b85c7a;
}

.language-switcher button {
  margin: 0;
  padding: 0;
  background: none;
  border: none;
  color: #b85c7a;
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
}

.language-switcher button:hover {
  color: #d96b92;
  transform: none;
}
  </style>
</head>

<body>

  <div class="language-switcher">
  <button type="button" onclick="setLanguage('en')">EN</button>
  <span>·</span>
  <button type="button" onclick="setLanguage('ko')">한국어</button>
  <span>·</span>
  <button type="button" onclick="setLanguage('ja')">日本語</button>
</div>
    <h1 id="rouletteTitle">Vibe Roulette 🎡</h1>

    </p>
<div class="wheel-wrap">

</div>

  </main>

  <script>
    const vibes = [

  { name: "Girly", emoji: "🌸", keywords: "feminine · lovely · everyday · sweet" },

  { name: "Whimsigoth", emoji: "🌙", keywords: "celestial · witchy · 90s · mystical" },
  { name: "Angelcore", emoji: "👼", keywords: "heavenly · airy · pure · ethereal" },
  { name: "Cutecore / Kawaii", emoji: "🧸", keywords: "adorable · colorful · playful · kawaii" },
  { name: "Lolita-inspired", emoji: "🍰", keywords: "doll · ornate · Victorian-inspired · elegant" },
  { name: "Mori Kei", emoji: "🍃", keywords: "forest · layered · natural · cozy" },
  { name: "Jirai Kei", emoji: "🖤🎀", keywords: "dark-cute · Japanese · ribbon · dramatic" },
  { name: "Himekaji", emoji: "🌸", keywords: "princess-casual · sweet · feminine · Japanese" },
  { name: "Grunge", emoji: "🎸", keywords: "rebellious · messy · alternative · 90s" },
  { name: "Indie Sleaze", emoji: "📸", keywords: "nightlife · messy · flash · indie" },
  { name: "Office Siren", emoji: "🕶️", keywords: "sleek · corporate · sensual · 2000s" },
  { name: "Boho Chic", emoji: "🦋", keywords: "free-spirited · earthy · layered · festival" },
  { name: "Cyber Y2K", emoji: "🖤💿", keywords: "futuristic · digital · metallic · tech" },
  { name: "Vintage", emoji: "📻", keywords: "nostalgic · timeless · retro · classic" }
];
 const translations = {
  en: {
    title: "Vibe Roulette 🎡",
    subtitle: "Not sure what aesthetic fits today? Let fate choose your vibe ♡",
    waiting: "Your vibe is waiting...",
    waitingText: "Tap the button and discover your aesthetic for today ♡",
    spinButton: "Spin My Vibe ♡",
    explore: "Explore This Vibe →",
    back: "← Back to all aesthetics"
  },

  ko: {
    title: "바이브 룰렛 🎡",
    subtitle: "오늘 어떤 무드가 어울릴지 모르겠어? 운명에게 맡겨봐 ♡",
    waiting: "오늘의 바이브가 기다리고 있어...",
    waitingText: "버튼을 눌러 오늘의 에스테틱을 발견해봐 ♡",
    spinButton: "오늘의 바이브 돌리기 ♡",
    explore: "이 바이브 둘러보기 →",
    back: "← 모든 에스테틱 보기"
  },

  ja: {
    title: "Vibeルーレット 🎡",
    subtitle: "今日どんな雰囲気にする？運命にVibeを選んでもらおう ♡",
    waiting: "今日のVibeは何かな…",
    waitingText: "ボタンを押して今日のAestheticを見つけよう ♡",
    spinButton: "Vibeを回す ♡",
    explore: "このVibeを見る →",
    back: "← すべてのAestheticを見る"
  }
};
    function setLanguage(lang) {
  const t = translations[lang];

  document.getElementById("rouletteTitle").textContent = t.title;
  document.getElementById("rouletteSubtitle").textContent = t.subtitle;
  document.getElementById("resultName").textContent = t.waiting;
  document.getElementById("resultKeywords").textContent = t.waitingText;
  document.getElementById("spinButton").textContent = t.spinButton;
  document.getElementById("exploreLink").textContent = t.explore;
  document.getElementById("backLink").textContent = t.back;

  localStorage.setItem("prettyMindLanguage", lang);
}
    const savedLanguage = localStorage.getItem("prettyMindLanguage") || "en";
setLanguage(savedLanguage);
const canvas = document.getElementById("rouletteWheel");
const ctx = canvas.getContext("2d");

const wheelSize = canvas.width;
const center = wheelSize / 2;
const radius = center - 10;
const sliceAngle = (Math.PI * 2) / vibes.length;

const wheelColors = [
  "#f7c6d9",
  "#e9a8c1",
  "#f3d7e2",
  "#d98aaa",
  "#f8e4ec",
  "#c97799"
];

function drawWheel() {
  ctx.clearRect(0, 0, wheelSize, wheelSize);

  vibes.forEach((vibe, index) => {
    const startAngle = index * sliceAngle - Math.PI / 2;
    const endAngle = startAngle + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, startAngle, endAngle);
    ctx.closePath();

    ctx.fillStyle = wheelColors[index % wheelColors.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.65)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(startAngle + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#6f3f52";
    ctx.font = "bold 11px Georgia";
    ctx.fillText(vibe.name, radius - 15, 4);
    ctx.restore();
  });
}

drawWheel();
    updateSoundButton();
    const spinButton = document.getElementById("spinButton");
    const resultEmoji = document.getElementById("resultEmoji");
    const resultName = document.getElementById("resultName");
    const resultKeywords = document.getElementById("resultKeywords");
    const exploreLink = document.getElementById("exploreLink");
let currentRotation = 0;
let isSpinning = false;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  return audioCtx;
}

function playTickSound() {
  const ctx = getAudioContext();

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.type = "square";
  oscillator.frequency.value = 180;

  gain.gain.setValueAtTime(0.035, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + 0.025
  );

  oscillator.start(ctx.currentTime);
  oscillator.stop(ctx.currentTime + 0.025);
}
   function playResultSound() {
  const ctx = getAudioContext();

  const notes = [523.25, 659.25, 783.99];

  notes.forEach((frequency, index) => {
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    const startTime = ctx.currentTime + index * 0.12;

    gain.gain.setValueAtTime(0.001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.08, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);

    oscillator.start(startTime);
    oscillator.stop(startTime + 0.36);
  });
}
spinButton.addEventListener("click", function () {
  if (isSpinning) return;

  isSpinning = true;
  let tickDelay = 70;
let tickElapsed = 0;

function spinTick() {
  playTickSound();

  tickElapsed += tickDelay;

  if (tickElapsed < 4400) {
    tickDelay = 70 + Math.pow(tickElapsed / 4400, 2) * 350;
    setTimeout(spinTick, tickDelay);
  }
}

spinTick();
  spinButton.disabled = true;
  exploreLink.style.display = "none";

  resultEmoji.textContent = "✨";
  resultName.textContent = "Spinning...";
  resultKeywords.textContent = "Let fate choose your vibe ♡";

  const randomIndex = Math.floor(Math.random() * vibes.length);
  const selectedVibe = vibes[randomIndex];

  const sliceDegrees = 360 / vibes.length;

  const targetPosition =
    (360 - ((randomIndex + 0.5) * sliceDegrees) % 360) % 360;

  const currentPosition =
    ((currentRotation % 360) + 360) % 360;

  const extraRotation =
    (targetPosition - currentPosition + 360) % 360;

  currentRotation += (360 * 5) + extraRotation;

  canvas.style.transition =
    "transform 4.5s cubic-bezier(0.12, 0.72, 0.18, 1)";

  canvas.style.transform =
    `rotate(${currentRotation}deg)`;

  setTimeout(function () {
    if ("vibrate" in navigator) {
  navigator.vibrate([80, 40, 120]);
      playResultSound();

if ("vibrate" in navigator) {
  navigator.vibrate([80, 40, 120]);
}
}
    resultEmoji.textContent = selectedVibe.emoji;
    resultName.textContent = selectedVibe.name;
    resultKeywords.textContent = selectedVibe.keywords;

    exploreLink.href =
      "aesthetic-detail.html?name=" +
      encodeURIComponent(selectedVibe.name);

    exploreLink.style.display = "inline-block";

    spinButton.disabled = false;
    isSpinning = false;
  }, 4600);
});
  
  </script>

</html>

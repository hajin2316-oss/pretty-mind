<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretty Mind | Find Your Vibe</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.75), transparent 35%),
        linear-gradient(135deg, #fce4ec 0%, #f8cddd 50%, #fce7ef 100%);
      text-align: center;
      color: #d94f87;
      font-family: Georgia, "Times New Roman", serif;
    }

    .vibe-page {
      padding: 60px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #b85c7a;
      margin-bottom: 40px;
    }

    .vibe-cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .vibe-card {
      width: 180px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(231, 84, 128, 0.15);
      transition: 0.3s;
    }

    .vibe-card:hover {
      transform: translateY(-6px);
    }

    .vibe-card h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .vibe-card p {
      margin: 0;
      color: #b85c7a;
    }
  </style>
</head>

<body>

  <main class="vibe-page">
    <h1>What's your vibe today? ♡</h1>
    <p class="subtitle">Find the aesthetic that feels like you ✦</p>

    <div class="vibe-cards">

      <div class="vibe-card">
        <h2>Coquette ♡</h2>
        <p>Romantic · Soft · Girly</p>
      </div>

      <div class="vibe-card">
        <h2>Gyaru ✦</h2>
        <p>Glam · Confident · Bold</p>
      </div>

      <div class="vibe-card">
        <h2>Clean Girl ♡</h2>
        <p>Minimal · Natural · Fresh</p>
      </div>

      <div class="vibe-card">
        <h2>Jirai Kei ✦</h2>
        <p>Dark · Cute · Yami</p>
      </div>

    </div>
  </main>

</body>
</html>
